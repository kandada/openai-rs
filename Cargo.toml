[package]
name = "openai-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Full-featured Rust client for the OpenAI API — Chat, Images, Audio, Files, Embeddings, Models, streaming SSE, auto-retry, token counting. Compatible with OpenAI, DeepSeek, Kimi, MiniMax, Ollama."
license = "Apache-2.0"
repository = "https://github.com/xiefujin/openai-rs"
homepage = "https://github.com/xiefujin/openai-rs"
documentation = "https://docs.rs/openai-rs"
readme = "README.md"
authors = ["xiefujin <490021684@qq.com>"]
keywords = ["openai", "llm", "chat", "api", "sse", "async", "dall-e", "whisper", "tts", "embeddings", "gpt", "deepseek"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[workspace]

[features]
default = []
async = ["dep:reqwest", "dep:tokio", "dep:futures", "dep:bytes"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
